<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0f172a;
            color:white;
            font-family:Poppins,sans-serif;
            text-align:center;
        }

        h1{
            font-size:80px;
            margin:0;
        }

        p{
            font-size:20px;
            margin:15px 0;
        }

        a{
            display:inline-block;
            margin-top:20px;
            padding:12px 30px;
            background:#2563eb;
            color:#fff;
            text-decoration:none;
            border-radius:10px;
        }
    </style>

</head>
<body>

<div>

    <h1>404</h1>

    <p>Page Not Found</p>

    <a href="/">Go Home</a>

</div>

</body>
</html>
