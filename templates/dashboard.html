<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nano Counter Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-robot"></i>
            <h2>AI Nano Counter</h2>
        </div>

        <ul class="menu">

            <li class="active">
                <a href="/dashboard">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="/image">
                    <i class="fa-solid fa-image"></i>
                    Image Detection
                </a>
            </li>

            <li>
                <a href="/camera">
                    <i class="fa-solid fa-camera"></i>
                    Live Camera
                </a>
            </li>

            

            <li>
    <a href="/reports">
        <i class="fa-solid fa-chart-simple"></i>
        Analytics
    </a>
</li>

            <li>
                <a href="/profile">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="/logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->
    <main class="content dashboard-content">

        <!-- Top Bar -->
        <header class="topbar">

            <div>
                <h1>Welcome, {{ user.name }}</h1>
                <p>AI Powered Object Detection Dashboard</p>
            </div>

            <div class="search">

                <input type="text" placeholder="Search...">

                <i class="fa-solid fa-magnifying-glass"></i>

            </div>

        </header>

        <!-- Statistics -->
    

        <!-- Charts -->
       

        <!-- Quick Actions -->
        <section class="quick-actions">

            <div class="action-card">

                <i class="fa-solid fa-image"></i>

                <h3>Image Detection</h3>

                <a href="/image">Open</a>

            </div>

            <div class="action-card">

                <i class="fa-solid fa-camera"></i>

                <h3>Live Camera</h3>

                <a href="/camera">Open</a>

            </div>

            

        </section>

        <!-- Recent Detection -->
        <section class="recent">

            <h2>Recent Detections</h2>

            <table>

                <thead>

                    <tr>
                        <th>Image</th>
                        <th>Objects</th>
                        <th>Time</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td>traffic.jpg</td>

                        <td>24</td>

                        <td>2 min ago</td>

                    </tr>

                    <tr>

                        <td>bottle.jpg</td>

                        <td>15</td>

                        <td>15 min ago</td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>
</html>
